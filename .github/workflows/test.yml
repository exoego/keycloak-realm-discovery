name: Test

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }}${{ matrix.keycloak && format(', Keycloak {0}', matrix.keycloak) || '' }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
          - 25
        # Empty means the Keycloak version of the catalog. It keeps the rows below from merging into the Java 21 row.
        keycloak:
          - ''
        # The last release of each older major. The provider runs in the JDK of the Keycloak image, so one test JDK is enough.
        include:
          - java: 21
            keycloak: 24.0.5
          - java: 21
            keycloak: 25.0.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle compiles with JDK 21 and runs the tests with the JDK of the matrix.
      # The last version becomes JAVA_HOME.
      - name: Set up JDKs
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'
          # Gradle files are cached by setup-gradle, so do not set "cache: gradle" here.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The integration tests start Keycloak and PostgreSQL with Testcontainers, using the Docker of the runner.
      - name: Run Tests
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: ./gradlew check -PtestJavaVersion=${{ matrix.java }} -PtestKeycloakVersion="$KEYCLOAK_VERSION"

      # One row is enough. Every row measures the same tests.
      # The token keeps others from uploading fake numbers for main. A pull request from a fork gets
      # no secret. The action then uploads with no token, which Codecov allows for a fork of a public
      # repository. A failed upload must not fail the tests.
      - name: Upload coverage to Codecov
        if: matrix.java == 21 && matrix.keycloak == ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-java-${{ matrix.java }}-keycloak-${{ matrix.keycloak || 'catalog' }}
          path: build/jacoco/
          if-no-files-found: error
          retention-days: 1

      # The classes as Keycloak loaded them. The report needs them, and one Keycloak version is enough.
      - name: Upload the loaded classes
        if: matrix.java == 21 && matrix.keycloak == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loaded-classes
          path: build/jacoco-classes/keycloak/
          if-no-files-found: error
          retention-days: 1

  # Some code is for one Keycloak version only. So every branch must be tested by the rows together.
  coverage:
    name: Coverage of all versions
    timeout-minutes: 10
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: build/jacoco/

      - name: Download the loaded classes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loaded-classes
          path: build/jacoco-classes/keycloak/

      - name: Check the coverage
        run: ./gradlew coverageGateOfAllVersions

  # The one check of this workflow that branch protection requires. Its name does not change
  # when the matrix above changes. A new job of this workflow must be added to "needs".
  gate:
    name: Test gate
    timeout-minutes: 5
    # A skipped required job counts as passed, so run always and fail by hand.
    if: always()
    needs: [test, coverage]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
